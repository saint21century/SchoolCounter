<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <!-- Налаштування для повноекранного режиму на iPhone (iOS) -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Звіт">
    
    <!-- Налаштування для Android -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#7360f2">

    <title>Звіт відвідуваності</title>
    
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            padding: 16px; 
            background: #f4f5f9; 
            margin: 0; 
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
        }
        .container { 
            background: #ffffff; 
            padding: 24px 20px; 
            border-radius: 18px; 
            box-shadow: 0 6px 20px rgba(0,0,0,0.07); 
            width: 100%;
            max-width: 400px; 
        }
        h3 { 
            margin: 0 0 20px 0; 
            color: #222; 
            text-align: center; 
            font-size: 22px; 
        }
        .field-row { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            margin-bottom: 12px; 
            font-size: 16px; 
            font-weight: 600; 
            color: #444; 
        }
        .field-row input { 
            width: 80px; 
            padding: 9px 8px; 
            font-size: 18px; 
            border: 1.5px solid #dcdfe6; 
            border-radius: 8px; 
            text-align: center; 
            outline: none;
            transition: border-color 0.2s;
        }
        .field-row input:focus {
            border-color: #7360f2;
        }
        .field-row input[type="text"] {
            width: 95px;
        }
        .field-row input:read-only {
            background-color: #f6f7fb;
            color: #666;
        }
        button { 
            margin-top: 20px;
            padding: 15px; 
            width: 100%; 
            border: none; 
            border-radius: 10px; 
            cursor: pointer; 
            font-size: 17px; 
            font-weight: bold; 
            text-align: center;
            background: #7360f2; 
            color: white; 
            transition: opacity 0.2s, transform 0.1s;
        }
        button:active { 
            opacity: 0.85;
            transform: scale(0.99);
        }
        .success { 
            color: #155724; 
            background-color: #d4edda;
            border: 1px solid #c3e6cb;
            border-radius: 8px;
            padding: 10px;
            margin-top: 14px; 
            font-weight: 600; 
            display: none; 
            text-align: center; 
            font-size: 15px; 
        }
    </style>
</head>
<body>
    <div class="container">
        <h3>Звіт для Viber</h3>
        
        <div class="field-row">
            <span>Клас-</span>
            <input type="text" id="class_name" value="4-В">
        </div>
        <div class="field-row">
            <span>Кількість учнів-</span>
            <input type="number" id="total" min="0" inputmode="numeric">
        </div>
        <div class="field-row">
            <span>Очно-</span>
            <input type="number" id="offline" min="0" readonly>
        </div>
        <div class="field-row">
            <span>Присутні-</span>
            <input type="number" id="present" min="0" readonly>
        </div>
        <div class="field-row">
            <span>Відсутні-</span>
            <input type="number" id="absent" min="0" value="0" inputmode="numeric">
        </div>
        <div class="field-row">
            <span>Сімейн.(за межами)-</span>
            <input type="number" id="family" min="0" value="0" inputmode="numeric">
        </div>

        <button id="copyBtn">Скопіювати текст</button>

        <div id="status" class="success">✓ Текст скопійовано!</div>
    </div>

    <script>
        const elClass = document.getElementById('class_name');
        const elTotal = document.getElementById('total');
        const elOffline = document.getElementById('offline');
        const elPresent = document.getElementById('present');
        const elAbsent = document.getElementById('absent');
        const elFamily = document.getElementById('family');
        const statusBlock = document.getElementById('status');

        // Відновлення даних
        if (localStorage.getItem('saved_class')) elClass.value = localStorage.getItem('saved_class');
        if (localStorage.getItem('saved_total')) elTotal.value = localStorage.getItem('saved_total');

        function autoCalculate() {
            const total = parseInt(elTotal.value) || 0;
            const absent = parseInt(elAbsent.value) || 0;
            const family = parseInt(elFamily.value) || 0;

            let presentCount = total - absent - family;
            if (presentCount < 0) presentCount = 0;

            elPresent.value = presentCount;
            elOffline.value = presentCount;

            localStorage.setItem('saved_class', elClass.value);
            localStorage.setItem('saved_total', elTotal.value);
        }

        elTotal.addEventListener('input', autoCalculate);
        elAbsent.addEventListener('input', autoCalculate);
        elFamily.addEventListener('input', autoCalculate);
        elClass.addEventListener('input', autoCalculate);

        autoCalculate();

        // Універсальне копіювання для iOS та Android
        document.getElementById('copyBtn').addEventListener('click', async () => {
            const message = `Клас- ${elClass.value}\nКількість учнів- ${elTotal.value || 0}\nОчно- ${elOffline.value || 0}\nПрисутні- ${elPresent.value || 0}\nВідсутні- ${elAbsent.value || 0}\nСімейн.(за межами)- ${elFamily.value || 0}`;

            let success = false;

            if (navigator.clipboard && window.isSecureContext) {
                try {
                    await navigator.clipboard.writeText(message);
                    success = true;
                } catch (e) {
                    success = false;
                }
            }

            if (!success) {
                const textArea = document.createElement("textarea");
                textArea.value = message;
                textArea.style.position = "fixed";
                textArea.style.left = "-9999px";
                document.body.appendChild(textArea);
                textArea.focus();
                textArea.select();
                try {
                    document.execCommand('copy');
                    success = true;
                } catch (err) {
                    alert("Не вдалося скопіювати текст");
                }
                document.body.removeChild(textArea);
            }

            if (success) {
                statusBlock.style.display = 'block';
                setTimeout(() => { statusBlock.style.display = 'none'; }, 2500);
            }
        });
    </script>
</body>
</html>
